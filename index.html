
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Time Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 800px;">

    <h3 class="mb-3">Time Calculator</h3>

    <div class="mb-3">
        <label for="timeInput" class="form-label">Enter times (one per line)</label>
        <textarea id="timeInput" class="form-control" rows="12"
            placeholder="30m&#10;4h&#10;1h 45m&#10;Something (5h 15m)&#10;Something else (21h 30m)"></textarea>
    </div>

    <div class="d-flex flex-wrap gap-3">
        <div class="mb-3" style="max-width: 250px;">
            <label for="tariff" class="form-label">Tariff per hour</label>
            <input type="number" id="tariff" class="form-control" value="100" min="0" step="0.01">
        </div>

        <div class="mb-3" style="max-width: 150px;">
            <label for="currency" class="form-label">Currency</label>
            <input type="text" id="currency" class="form-control" value="EUR" maxlength="5">
        </div>
    </div>

    <div class="d-flex gap-2">
        <button type="button" id="calculate" class="btn btn-primary">
            Calculate
        </button>

        <button type="button" id="reset" class="btn btn-outline-secondary">
            Reset
        </button>
    </div>

    <div id="results" class="mt-4" style="display:none;">

        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <h5 class="card-title mb-3">Total</h5>
                <div class="fs-4 fw-bold" id="resultText"></div>
                <div class="text-muted small mt-1" id="entryCount"></div>

                <button type="button" id="copyResult" class="btn btn-sm btn-outline-primary mt-3">
                    Copy result
                </button>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title mb-3">Breakdown</h5>

                <div class="table-responsive">
                    <table class="table table-striped table-bordered align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Description</th>
                                <th class="text-end">Time</th>
                                <th class="text-end">Decimal</th>
                                <th class="text-end">Cost</th>
                            </tr>
                        </thead>
                        <tbody id="resultRows"></tbody>
                        <tfoot class="table-light fw-bold">
                            <tr>
                                <td>Total</td>
                                <td class="text-end" id="totalTime"></td>
                                <td class="text-end" id="totalDecimal"></td>
                                <td class="text-end" id="totalCost"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>

                <button type="button" id="copyBreakdown" class="btn btn-sm btn-outline-primary mt-3">
                    Copy lines
                </button>
            </div>
        </div>

        <div id="errors" class="mt-3"></div>

    </div>

</div>

<script>
$(function() {

    let copyLines = [];

    function formatNumber(number) {
        return number.toFixed(2).replace(/\.?0+$/, '');
    }

    function formatTime(minutes) {
        const hours = Math.floor(minutes / 60);
        const mins = minutes % 60;

        return hours + 'h ' + mins + 'm';
    }

    $('#calculate').on('click', function() {

        const lines = $('#timeInput').val().split(/\r?\n/);
        const tariff = parseFloat($('#tariff').val());
        const currency = $('#currency').val().trim();

        copyLines = [];
        let totalMinutes = 0;
        let totalCost = 0;
        let validCount = 0;
        let errors = [];
        let rows = '';

        if (!Number.isFinite(tariff) || tariff < 0) {
            alert('Please enter a valid tariff.');
            return;
        }

        lines.forEach(function(line, index) {

            line = line.trim();

            if (!line) return;

            // Extract time from either:
            // 4h 30m
            // 4h30min
            // Something (4h 30m)
            // Something else (1.5h)
            const match = line.match(/^(.*?)\s*\(?(?:(\d+(?:\.\d+)?)\s*h)?\s*(?:(\d+)\s*(?:min|m))?\)?$/i);

            if (!match || (!match[2] && !match[3])) {
                errors.push('Line ' + (index + 1) + ': ' + $('<div>').text(line).html());
                return;
            }

            const description = match[1].trim() || '-';
            const hours = parseFloat(match[2] || 0);
            const minutes = parseInt(match[3] || 0, 10);

            const entryMinutes = Math.round(hours * 60) + minutes;
            const decimalHours = entryMinutes / 60;
            const cost = decimalHours * tariff;

            copyLines.push(description + ': ' + formatNumber(cost) + ' ' + currency + ',');

            totalMinutes += entryMinutes;
            totalCost += cost;
            validCount++;

            rows += `
                <tr>
                    <td>${$('<div>').text(description).html()}</td>
                    <td class="text-end text-nowrap">${formatTime(entryMinutes)}</td>
                    <td class="text-end">${formatNumber(decimalHours)}h</td>
                    <td class="text-end text-nowrap">${cost.toFixed(2)} ${$('<div>').text(currency).html()}</td>
                </tr>
            `;
        });

        const totalDecimal = totalMinutes / 60;

        $('#resultRows').html(rows);

        $('#resultText').text(
            formatTime(totalMinutes) + ' / ' + formatNumber(totalDecimal) + 'h'
        );

        $('#entryCount').text(
            validCount + ' valid entries' +
            (errors.length ? ' · ' + errors.length + ' invalid entries' : '')
        );

        $('#totalTime').text(formatTime(totalMinutes));
        $('#totalDecimal').text(formatNumber(totalDecimal) + 'h');
        $('#totalCost').text(totalCost.toFixed(2) + ' ' + currency);

        if (errors.length) {
            $('#errors').html(
                '<div class="alert alert-danger">' +
                '<strong>Invalid lines:</strong><ul class="mb-0 mt-2">' +
                errors.map(function(error) {
                    return '<li>' + error + '</li>';
                }).join('') +
                '</ul></div>'
            );
        } else {
            $('#errors').empty();
        }

        $('#results').show();

    });

    $('#copyResult').on('click', function() {

        const result = $('#resultText').text() +
            ' | Total cost: ' + $('#totalCost').text();

        navigator.clipboard.writeText(result).then(function() {
            $('#copyResult').text('Copied!');

            setTimeout(function() {
                $('#copyResult').text('Copy result');
            }, 1500);
        });

    });

    $('#copyBreakdown').on('click', function() {
        navigator.clipboard.writeText(copyLines.join('\n')).then(function() {
            $('#copyBreakdown').text('Copied!');

            setTimeout(function() {
                $('#copyBreakdown').text('Copy lines');
            }, 1500);
        });
    });

    $('#reset').on('click', function() {
        $('#timeInput').val('');
        $('#tariff').val('100');
        $('#currency').val('EUR');
        $('#results').hide();
        $('#resultRows').empty();
        $('#errors').empty();
    });

});
</script>

</body>
</html>
