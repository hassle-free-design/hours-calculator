
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Time Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 700px;">

    <h3 class="mb-3">Time Calculator</h3>

    <div class="mb-3">
        <label for="timeInput" class="form-label">Enter times (one per line)</label>
        <textarea id="timeInput" class="form-control" rows="12"
            placeholder="30m&#10;4h&#10;1h 45m&#10;3h30min&#10;1.5h"></textarea>
    </div>

    <div class="d-flex gap-2">
        <button type="button" id="calculate" class="btn btn-primary">
            Calculate
        </button>

        <button type="button" id="reset" class="btn btn-outline-secondary">
            Reset
        </button>
    </div>

    <div id="results" class="mt-4" style="display:none;">
        <div class="card shadow-sm">
            <div class="card-body">

                <h5 class="card-title mb-3">Results</h5>

                <div class="fs-4 fw-bold mb-2" id="resultText"></div>

                <div class="text-muted small mb-3" id="entryCount"></div>

                <button type="button" id="copyResult" class="btn btn-sm btn-outline-primary">
                    Copy result
                </button>

                <div id="errors" class="mt-3"></div>

            </div>
        </div>
    </div>

</div>

<script>
$(function() {

    $('#calculate').on('click', function() {

        const lines = $('#timeInput').val().split(/\r?\n/);

        let totalMinutes = 0;
        let validCount = 0;
        let errors = [];

        lines.forEach(function(line, index) {

            line = line.trim();

            if (!line) return;

            // Supports:
            // 4h, 30m, 30min, 4h30m, 4h 30m, 1.5h, 1.25h
            // const match = line.match(/^(?:(\d+(?:\.\d+)?)\s*h)?\s*(?:(\d+)\s*(?:min|m))?$/i);
			
			// new regex this also allows: Something (5h 15m)
            const match = line.match(/(?:^|\()(?:(\d+(?:\.\d+)?)\s*h)?\s*(?:(\d+)\s*(?:min|m))?\)?$/i);

            if (!match || (!match[1] && !match[2])) {
                errors.push('Line ' + (index + 1) + ': ' + $('<div>').text(line).html());
                return;
            }

            const hours = parseFloat(match[1] || 0);
            const minutes = parseInt(match[2] || 0, 10);

            // Decimal hours are converted to minutes
            const entryMinutes = Math.round(hours * 60) + minutes;

            totalMinutes += entryMinutes;
            validCount++;
        });

        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        const decimalHours = (totalMinutes / 60).toFixed(2);

        $('#resultText').text(
            hours + 'h ' + minutes + 'm / ' + decimalHours + 'h'
        );

        $('#entryCount').text(
            validCount + ' valid entries' +
            (errors.length ? ' · ' + errors.length + ' invalid entries' : '')
        );

        if (errors.length) {
            $('#errors').html(
                '<div class="alert alert-danger mb-0">' +
                '<strong>Invalid lines:</strong><ul class="mb-0 mt-2">' +
                errors.map(function(error) {
                    return '<li>' + error + '</li>';
                }).join('') +
                '</ul></div>'
            );
        } else {
            $('#errors').empty();
        }

        $('#results').show();

    });

    $('#copyResult').on('click', function() {

        const result = $('#resultText').text();

        navigator.clipboard.writeText(result).then(function() {
            $('#copyResult').text('Copied!');
            setTimeout(function() {
                $('#copyResult').text('Copy result');
            }, 1500);
        });

    });

    $('#reset').on('click', function() {
        $('#timeInput').val('');
        $('#results').hide();
        $('#resultText').text('');
        $('#entryCount').text('');
        $('#errors').empty();
    });

});
</script>

</body>
</html>
